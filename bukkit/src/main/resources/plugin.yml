name: KraftLink
version: '${project.version}'
main: fr.nivcoo.kraftlink.bukkit.KraftLink
folia-supported: true
softdepend: [floodgate]
loadbefore: [AuthMe]

description: KraftInk server connection
author: nivcoo
commands:
  kraftlink:
    description: Manage the KraftInk server connection
permissions:
  kraftlink.admin:
    default: op
  kraftlink.link:
    default: true
  kraftlink.signin:
    default: true
